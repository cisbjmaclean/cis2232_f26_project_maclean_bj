<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle">Report</title>
</head>
<body>
<style scoped="scoped">input:not(.hidden) {
    display: inline-block;
    float: right
}

.cd {
    color: #F00 !important;
    font-weight: bold;
    margin-bottom: -48px
}

label {
    margin-right: 8px
}</style>
<nav th:replace="fragments/navHeader :: navbar"></nav>


<div class="container has-text-centered">
    <h2 class="title is-2" th:text="#{label.report.player.name.report}">_</h2>

    <form th:action="@{/report/player/name/submit}" method="post" class="wbb"
          style="display:inline-block;text-align:left!important">
        <label th:text="#{label.report.player.name.report}">Player Name: </label>
        <input type="text" th:field="${reportInput.name}"></input>
        <br></br>
        <button style="display:block;margin-top:24px!important" class="centered">Submit</button>
    </form>

    <p th:if="${not #strings.isEmpty(message)}" th:text="#{error.message.no.data.found.name}">not found</p>
    <!--https://stackoverflow.com/a/33106495-->
    <table class="wbb centered" th:if="${not #lists.isEmpty(reportInput.squashMatches)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Player 1</th>
            <th>Player 2</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item,iterStat : ${reportInput.squashMatches}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.player1Name}"></td>
            <td th:text="${item.player2Name}"></td>
        </tr>
        </tbody>
    </table>

</div>

<br></br>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
