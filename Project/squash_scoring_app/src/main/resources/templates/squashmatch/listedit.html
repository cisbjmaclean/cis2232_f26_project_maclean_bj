<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Topic List</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>
<div class="container my-4">
    <h2 class="mb-3 text-center title">Squash Match List for Edit</h2>
    <h2 class="mb-3 text-center error" th:if="${not #strings.isEmpty(messageError)}" th:text="${messageError}">Message
        from controller</h2>
    <h2 class="mb-3 text-center success" th:if="${not #strings.isEmpty(messageSuccess)}" th:text="${messageSuccess}">
        Message success from controller</h2>

    <div class="table-responsive">
        <form action="#" th:action="@{/squashmatch/list/edit/submit}" th:object="${form}"
              method="post">
            <fieldset>
                <input type="submit" id="submitButton" th:value="Save">
                <input type="reset" id="resetButton" name="reset" th:value="Reset"/>
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark text-center">
                    <tr>
                        <th>ID</th>
                        <th>Match Date</th>
                        <th>Created Date/Time</th>
                        <th>Player 1</th>
                        <th>Player 2</th>

                        <th>Game 1 P1</th>
                        <th>Game 1 P2</th>

                        <th>Game 2 P1</th>
                        <th>Game 2 P2</th>

                        <th>Game 3 P1</th>
                        <th>Game 3 P2</th>

                        <th>Game 4 P1</th>
                        <th>Game 4 P2</th>

                        <th>Game 5 P1</th>
                        <th>Game 5 P2</th>

                    </tr>
                    </thead>

                    <tbody>

<!--                    <tr th:each="book, itemStat : *{books}">-->
<!--                        <td><input th:field="*{books[__${itemStat.index}__].title}" /></td>-->
<!--                        <td><input th:field="*{books[__${itemStat.index}__].author}" /></td>-->

                    <tr th:each="current,itemStat : ${form.squashMatches}">
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].id}"/></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].matchDate}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].createdDateTime}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Name}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Name}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Game1Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Game1Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Game2Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Game2Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Game3Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Game3Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Game4Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Game4Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player1Game5Score}"></td>
                        <td><input th:field="*{squashMatches[__${itemStat.index}__].player2Game5Score}"></td>
                    </tr>

                    <!-- Message when no data -->
                    <tr th:if="${#lists.isEmpty(form.squashMatches)}">
                        <td colspan="13" class="text-center text-muted py-4">
                            No matches found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </fieldset>
        </form>
    </div>


</div>
<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
